name: Supabase Cloud DEV

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe operation against HABITAT DEV only
        required: true
        type: choice
        options:
          - verify
          - deploy
          - smoke
      confirmation:
        description: Type HABITAT-DEV (never a production project ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: habitat-supabase-development
  cancel-in-progress: false

jobs:
  development:
    name: ${{ inputs.operation }} HABITAT DEV
    if: inputs.confirmation == 'HABITAT-DEV'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: development
    env:
      HABITAT_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Verify DEV project identity and migration status
        if: inputs.operation == 'verify'
        run: scripts/supabase-dev.sh verify
        env: &supabase_cli_dev
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_DB_PASSWORD_DEV: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

      - name: Apply verified migrations to DEV
        if: inputs.operation == 'deploy'
        run: scripts/supabase-dev.sh migrate
        env: *supabase_cli_dev

      - name: Deploy P4.1 functions to DEV
        if: inputs.operation == 'deploy'
        run: scripts/supabase-dev.sh deploy-functions
        env: *supabase_cli_dev

      - name: End-to-end document smoke test against DEV
        if: inputs.operation == 'smoke'
        run: npm run cloud-dev:smoke
        env:
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY_DEV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          P41_DEV_ADVISOR_EMAIL: ${{ secrets.P41_DEV_ADVISOR_EMAIL }}
          P41_DEV_ADVISOR_PASSWORD: ${{ secrets.P41_DEV_ADVISOR_PASSWORD }}
          P41_DEV_OWNER_EMAIL: ${{ secrets.P41_DEV_OWNER_EMAIL }}
          P41_DEV_OWNER_PASSWORD: ${{ secrets.P41_DEV_OWNER_PASSWORD }}
          P41_DEV_PROPERTY_ID: ${{ secrets.P41_DEV_PROPERTY_ID }}

      - name: Upload generated PDF for visual review
        if: inputs.operation == 'smoke' && success()
        uses: actions/upload-artifact@v4
        with:
          name: p42-property-sheets-dev
          path: |
            test-results/p42-property-sheet-dev-*.pdf
            test-results/p42-cloud-smoke-summary.json
          if-no-files-found: error
          retention-days: 7
